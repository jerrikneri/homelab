apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: js-sandbox
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jerrikneri/homelab.git
    targetRevision: HEAD
    path: k8s/js
  destination: 
    server: https://kubernetes.default.svc
    namespace: js

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true