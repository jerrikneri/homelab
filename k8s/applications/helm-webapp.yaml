apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-argo-application
  namespace: helm-webapp
spec:
  project: default

  source:
    repoURL: https://github.com/jerrikneri/homelab.git
    targetRevision: HEAD
    path: k8s/helm-webapp
  destination: 
    server: https://kubernetes.default.svc
    namespace: helm-webapp

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true